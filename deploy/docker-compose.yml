services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U movies -d movies"]
      interval: 5s
      timeout: 3s
      retries: 20

  movies-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: movies
    entrypoint: ["psql", "-h", "postgres", "-U", "movies", "-d", "movies", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/V002__movie_operations.sql"]
    command: []
    volumes:
      - ./postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  oscars-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oscars
      POSTGRES_USER: oscars
      POSTGRES_PASSWORD: ${OSCARS_DB_PASSWORD:-oscars}
    volumes:
      - oscars-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U oscars -d oscars"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9092"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s

  config:
    build:
      context: ..
      dockerfile: deploy/config/Dockerfile
    image: soa/config-server
    volumes:
      - ../config-repo:/config-repo:ro
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8888"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  eureka:
    build:
      context: ..
      dockerfile: deploy/eureka/Dockerfile
    image: soa/eureka-server
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8761"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  payara:
    build:
      context: ..
      dockerfile: deploy/movies/Dockerfile
    image: soa/movies-service
    environment:
      MOVIES_INTERNAL_TOKEN: ${MOVIES_INTERNAL_TOKEN:-soa-local-internal-token}
      MOVIES_OPERATION_TIMEOUT_MS: ${MOVIES_OPERATION_TIMEOUT_MS:-5000}
      MOVIES_DB_URL: jdbc:postgresql://postgres:5432/movies
      MOVIES_DB_USER: movies
      MOVIES_DB_PASSWORD: movies
    ports:
      - "8181:8181"
    volumes:
      - ./certs/out/payara.crt:/run/secrets/movies.crt:ro
      - ./certs/out/payara.key:/run/secrets/movies.key:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://127.0.0.1:8181/movies/1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      movies-migrate:
        condition: service_completed_successfully

  oscars-1: &oscars
    build: &oscars-build
      context: ..
      dockerfile: deploy/oscars/Dockerfile
    image: soa/oscars-service
    environment: &oscars-env
      MOVIES_SERVICE_URL: https://payara:8181
      MOVIES_INTERNAL_TOKEN: ${MOVIES_INTERNAL_TOKEN:-soa-local-internal-token}
      OSCARS_DB_URL: jdbc:postgresql://oscars-postgres:5432/oscars
      OSCARS_DB_PASSWORD: ${OSCARS_DB_PASSWORD:-oscars}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes: &oscars-volumes
      - ./certs/out/wildfly.crt:/run/secrets/oscars.crt:ro
      - ./certs/out/wildfly.key:/run/secrets/oscars.key:ro
    healthcheck: &oscars-healthcheck
      test: ["CMD-SHELL", "wget -q --no-check-certificate -S --spider https://127.0.0.1:8443/oscar/jobs/not-a-uuid/status 2>&1 | grep -q 'HTTP/1.1 400'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on: &oscars-depends
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      payara:
        condition: service_started
      oscars-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  oscars-2:
    <<: *oscars
    container_name: oscars-2

  haproxy:
    image: haproxy:3.0-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs/out/haproxy.pem:/usr/local/etc/haproxy/oscar.pem:ro
    ports:
      - "8443:8443"
    depends_on:
      - oscars-1
      - oscars-2

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: ["debug"]
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: soa/frontend
    ports:
      - "443:443"
    volumes:
      - ./certs/out/ca.crt:/etc/nginx/certs/ca.crt:ro
      - ./certs/out/payara.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/out/payara.key:/etc/nginx/certs/server.key:ro
      - ./kafka-ui.htpasswd:/etc/nginx/auth/kafka-ui.htpasswd:ro
    depends_on:
      - payara
      - oscars-1
      - oscars-2

volumes:
  pgdata:
  oscars-pgdata:
