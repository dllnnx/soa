services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U movies -d movies"]
      interval: 5s
      timeout: 3s
      retries: 20

  movies-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: movies
    entrypoint: ["psql", "-h", "postgres", "-U", "movies", "-d", "movies", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/V002__movie_operations.sql"]
    command: []
    volumes:
      - ./postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  oscars-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oscars
      POSTGRES_USER: oscars
      POSTGRES_PASSWORD: ${OSCARS_DB_PASSWORD:-oscars}
    volumes:
      - oscars-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U oscars -d oscars"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms128m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  payara:
    build:
      context: ..
      dockerfile: deploy/payara/Dockerfile
    image: soa/movies-service
    platform: linux/amd64
    environment:
      MOVIES_INTERNAL_TOKEN: ${MOVIES_INTERNAL_TOKEN:-soa-local-internal-token}
      MOVIES_OPERATION_TIMEOUT_MS: ${MOVIES_OPERATION_TIMEOUT_MS:-5000}
      JVM_ARGS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
    ports:
      - "8181:8181"
      - "4848:4848"
    volumes:
      - ./certs/out/keystore.jks:/run/secrets/payara.jks:ro
    depends_on:
      postgres:
        condition: service_healthy
      movies-migrate:
        condition: service_completed_successfully

  wildfly:
    build:
      context: ..
      dockerfile: deploy/wildfly/Dockerfile
    image: soa/oscars-service
    environment:
      MOVIES_SERVICE_URL: https://payara:8181
      MOVIES_INTERNAL_TOKEN: ${MOVIES_INTERNAL_TOKEN:-soa-local-internal-token}
      OSCARS_DB_URL: jdbc:postgresql://oscars-postgres:5432/oscars
      OSCARS_DB_PASSWORD: ${OSCARS_DB_PASSWORD:-oscars}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JBOSS_JAVA_SIZING: "-Xms64m -Xmx256m -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
    ports:
      - "8443:8443"
      - "9990:9990"
    command: ["-b", "0.0.0.0", "-bmanagement", "0.0.0.0"]
    volumes:
      - ./certs/out/wildfly.p12:/run/secrets/wildfly.p12:ro
    depends_on:
      payara:
        condition: service_started
      oscars-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.33.1
    environment:
      URLS: '[{"url":"/docs/moviesApi.yaml","name":"Movies Service"},{"url":"/docs/oscarApi.yaml","name":"Oscars Service"}]'
      URLS_PRIMARY_NAME: "Movies Service"
      DEEP_LINKING: "true"
      DISPLAY_REQUEST_DURATION: "true"
      TRY_IT_OUT_ENABLED: "true"
    volumes:
      - ../moviesApi.yaml:/usr/share/nginx/html/moviesApi.yaml:ro
      - ../oscarApi.yaml:/usr/share/nginx/html/oscarApi.yaml:ro

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build: ../frontend
    image: soa/frontend
    ports:
      - "443:443"
    volumes:
      - ./certs/out/ca.crt:/etc/nginx/certs/ca.crt:ro
      - ./certs/out/payara.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/out/payara.key:/etc/nginx/certs/server.key:ro
      - ./kafka-ui.htpasswd:/etc/nginx/auth/kafka-ui.htpasswd:ro
    depends_on:
      - payara
      - wildfly
      - swagger-ui

volumes:
  pgdata:
  oscars-pgdata:
