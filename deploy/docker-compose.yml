services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies -d movies"]
      interval: 5s
      timeout: 3s
      retries: 20

  payara:
    build:
      context: ..
      dockerfile: deploy/payara/Dockerfile
    image: soa/movies-service
    platform: linux/amd64
    environment:
      JVM_ARGS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
    ports:
      - "8181:8181"
      # админ-консоль Payara
      - "127.0.0.1:4848:4848"
    volumes:
      - ./certs/out/keystore.jks:/run/secrets/payara.jks:ro
    depends_on:
      postgres:
        condition: service_healthy

  wildfly:
    build:
      context: ..
      dockerfile: deploy/wildfly/Dockerfile
    image: soa/oscars-service
    environment:
      MOVIES_SERVICE_URL: https://payara:8181
      JBOSS_JAVA_SIZING: "-Xms64m -Xmx256m -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
    ports:
      - "8443:8443"
    volumes:
      - ./certs/out/wildfly.p12:/run/secrets/wildfly.p12:ro
    depends_on:
      - payara

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.33.1
    environment:
      URLS: '[{"url":"/docs/moviesApi.yaml","name":"Movies Service"},{"url":"/docs/oscarApi.yaml","name":"Oscars Service"}]'
      URLS_PRIMARY_NAME: "Movies Service"
      DEEP_LINKING: "true"
      DISPLAY_REQUEST_DURATION: "true"
      TRY_IT_OUT_ENABLED: "true"
    volumes:
      - ../moviesApi.yaml:/usr/share/nginx/html/moviesApi.yaml:ro
      - ../oscarApi.yaml:/usr/share/nginx/html/oscarApi.yaml:ro

  frontend:
    build: ../frontend
    image: soa/frontend
    ports:
      - "3000:443"
    volumes:
      - ./certs/out/ca.crt:/etc/nginx/certs/ca.crt:ro
      - ./certs/out/payara.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/out/payara.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - payara
      - wildfly
      - swagger-ui

volumes:
  pgdata:
