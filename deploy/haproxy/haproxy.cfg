global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    retries 2

frontend oscar_https
    bind *:8443 ssl crt /usr/local/etc/haproxy/oscar.pem
    default_backend oscars

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

backend oscars
    option httpchk GET /oscar/actuator/health/readiness
    http-check expect status 200
    server oscars-1 oscars-1:8443 check ssl verify none inter 5s fall 3 rise 2 resolvers docker init-addr last,libc,none
    server oscars-2 oscars-2:8444 check ssl verify none inter 5s fall 3 rise 2 resolvers docker init-addr last,libc,none
