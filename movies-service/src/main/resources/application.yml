movies:
  internal-token: ${MOVIES_INTERNAL_TOKEN}
  operation-timeout-ms: ${MOVIES_OPERATION_TIMEOUT_MS:5000}

server:
  port: 8181
  ssl:
    certificate: ${MOVIES_TLS_CERT:/run/secrets/movies.crt}
    certificate-private-key: ${MOVIES_TLS_KEY:/run/secrets/movies.key}
    enabled: true

spring:
  application:
    name: movies-service
  config:
    import: configserver:${CONFIG_URL:http://config:8888}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      jakarta.persistence.query.timeout: 3000
  jackson:
    deserialization:
      fail-on-unknown-properties: true

eureka:
  instance:
    hostname: payara
