openapi: 3.0.3
info:
  title: Movie Service API
  version: 1.0.0
  description: |
    Управление коллекцией фильмов
servers:
  - url: http://localhost:8080
    description: локальный сервер
tags:
  - name: Movies
    description: Управление коллекцией фильмов
paths:
  /movies/list:
    post:
      tags:
        - Movies
      operationId: listMovies
      summary: Получить список фильмов
      description: Возвращает постраничную выборку фильмов с фильтрацией и сортировкой по любой комбинации полей.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieFilter'
            example:
              genre: SCIENCE_FICTION
              budget: null
              screenwriter:
                name: Christopher Nolan
      responses:
        '200':
          description: Список фильмов получен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePage'
        '400':
          $ref: '#/components/responses/BadRequest400'
  /movies/add:
    post:
      tags:
        - Movies
      operationId: addMovie
      summary: Создать новый фильм
      description: Создает новый фильм с автогенерируемыми id и creationDate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieInput'
            example:
              name: Interstellar
              coordinates:
                x: -12.5
                y: 300
              oscarsCount: 1
              budget: 165000000
              genre: SCIENCE_FICTION
              mpaaRating: PG_13
              screenwriter:
                name: Christopher Nolan
                height: 183
                eyeColor: BLUE
                hairColor: null
                nationality: UNITED_KINGDOM
                location:
                  x: 51.5074
                  y: 0
                  z: 12780
      responses:
        '201':
          description: Фильм создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
  /movies/average-budget:
    get:
      tags:
        - Movies
      operationId: getAverageBudget
      summary: Рассчитать среднее значение поля budget
      description: Вычисляет среднее значение budget по всем фильмам, имеющим бюджет.
      responses:
        '200':
          description: Среднее значение бюджета рассчитано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AverageBudget'
  /movies/by-mpaa-rating:
    delete:
      tags:
        - Movies
      operationId: deleteMoviesByMpaaRating
      summary: Удалить все фильмы с заданным mpaaRating
      description: Удаляет все фильмы, значение mpaaRating которых эквивалентно заданному, и возвращает количество удаленных.
      parameters:
        - name: mpaa-rating
          in: query
          required: true
          description: Значение рейтинга MPAA для удаления.
          schema:
            $ref: '#/components/schemas/MpaaRating'
      responses:
        '200':
          description: Фильмы удалены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
        '400':
          $ref: '#/components/responses/BadRequest400'
  /movies/by-screenwriter:
    delete:
      tags:
        - Movies
      operationId: deleteMovieByScreenwriter
      summary: Удалить один (любой) фильм с заданным screenwriter
      description: Удаляет один (любой) фильм, имя сценариста которого эквивалентно заданному.
      parameters:
        - name: name
          in: query
          required: true
          description: Уникальное имя сценариста.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[a-zA-Zа-яА-ЯЁё0-9 .,:!?()&-]{1,255}$'
      responses:
        '204':
          description: Фильм удалён.
        '400':
          $ref: '#/components/responses/BadRequest400'
        '404':
          $ref: '#/components/responses/NoMatchingMovie404'
  /movies/{movie-id}:
    get:
      tags:
        - Movies
      operationId: getMovie
      summary: Получить фильм по ИД
      description: Возвращает фильм по идентификатору.
      parameters:
        - $ref: '#/components/parameters/MovieIdPath'
      responses:
        '200':
          description: Фильм найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '404':
          $ref: '#/components/responses/MovieNotFound404'
    put:
      tags:
        - Movies
      operationId: updateMovie
      summary: Обновить фильм по ИД
      description: Полностью обновляет фильм по идентификатору.
      parameters:
        - $ref: '#/components/parameters/MovieIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieInput'
      responses:
        '200':
          description: Фильм обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '404':
          $ref: '#/components/responses/MovieNotFound404'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
    delete:
      tags:
        - Movies
      operationId: deleteMovie
      summary: Удалить фильм по ИД
      description: Удаляет фильм по идентификатору.
      parameters:
        - $ref: '#/components/parameters/MovieIdPath'
      responses:
        '204':
          description: Фильм удалён.
        '400':
          $ref: '#/components/responses/BadRequest400'
        '404':
          $ref: '#/components/responses/MovieNotFound404'
components:
  schemas:
    MovieGenre:
      type: string
      description: Жанр фильма.
      enum:
        - WESTERN
        - ADVENTURE
        - TRAGEDY
        - SCIENCE_FICTION
    MpaaRating:
      type: string
      description: Возрастной рейтинг MPAA.
      enum:
        - G
        - PG
        - PG_13
        - R
        - NC_17
    EyeColor:
      type: string
      description: Цвет глаз.
      enum:
        - GREEN
        - RED
        - BLUE
        - YELLOW
        - BROWN
    HairColor:
      type: string
      description: Цвет волос.
      enum:
        - GREEN
        - RED
        - BLACK
        - YELLOW
        - ORANGE
    Country:
      type: string
      description: Страна гражданства.
      enum:
        - UNITED_KINGDOM
        - SOUTH_KOREA
        - JAPAN
      default: JAPAN
    Coordinates:
      type: object
      description: Координаты фильма.
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: number
          format: double
          description: Координата X, строго больше -130.
          minimum: -130
          exclusiveMinimum: true
        y:
          type: number
          format: double
          description: Координата Y, максимум 388.
          maximum: 388
    Location:
      type: object
      description: Местоположение.
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          format: float
          description: Координата X.
        y:
          type: integer
          format: int32
          description: Координата Y.
        z:
          type: integer
          format: int64
          description: Координата Z.
    Person:
      type: object
      description: Сценарист.
      additionalProperties: false
      required:
        - name
        - height
        - eyeColor
        - nationality
        - location
      properties:
        name:
          type: string
          description: Имя.
          minLength: 1
          maxLength: 255
          pattern: '^[a-zA-Zа-яА-ЯЁё0-9 .,:!?()&-]{1,255}$'
          default: 'Евгений Цопа'
        height:
          type: number
          format: double
          description: Рост, строго больше 0.
          minimum: 0
          exclusiveMinimum: true
        eyeColor:
          $ref: '#/components/schemas/EyeColor'
        hairColor:
          type: string
          description: Цвет волос.
          nullable: true
          enum:
            - GREEN
            - RED
            - BLACK
            - YELLOW
            - ORANGE
        nationality:
          $ref: '#/components/schemas/Country'
        location:
          $ref: '#/components/schemas/Location'
    CoordinatesFilter:
      type: object
      description: Фильтр по координатам.
      additionalProperties: false
      properties:
        x:
          type: number
          format: double
          description: Точное совпадение coordinates.x.
          minimum: -130
          exclusiveMinimum: true
        y:
          type: number
          format: double
          description: Точное совпадение coordinates.y.
          maximum: 388
    LocationFilter:
      type: object
      description: Фильтр по местоположению.
      additionalProperties: false
      properties:
        x:
          type: number
          format: float
          description: Точное совпадение location.x.
        y:
          type: integer
          format: int32
          description: Точное совпадение location.y.
        z:
          type: integer
          format: int64
          description: Точное совпадение location.z.
    PersonFilter:
      type: object
      description: Фильтр по сценаристу.
      additionalProperties: false
      properties:
        name:
          type: string
          description: Точное совпадение имени.
          minLength: 1
          maxLength: 255
          pattern: '^[a-zA-Zа-яА-ЯЁё0-9 .,:!?()&-]{1,255}$'
        height:
          type: number
          format: double
          description: Точное совпадение роста.
          minimum: 0
          exclusiveMinimum: true
        eyeColor:
          $ref: '#/components/schemas/EyeColor'
        hairColor:
          type: string
          description: Точное совпадение цвета волос.
          nullable: true
          enum:
            - GREEN
            - RED
            - BLACK
            - YELLOW
            - ORANGE
        nationality:
          $ref: '#/components/schemas/Country'
        location:
          $ref: '#/components/schemas/LocationFilter'
    MovieFilter:
      type: object
      description: Фильтры точного совпадения для POST /movies/list.
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          description: Точное совпадение id.
          minimum: 1
        name:
          type: string
          description: Точное совпадение названия.
          minLength: 1
          maxLength: 255
          pattern: '^[a-zA-Zа-яА-ЯЁё0-9 .,:!?()&-]{1,255}$'
        coordinates:
          $ref: '#/components/schemas/CoordinatesFilter'
        creationDate:
          type: string
          format: date-time
          description: Точное совпадение creationDate.
        oscarsCount:
          type: integer
          format: int64
          description: Точное совпадение oscarsCount.
          minimum: 0
        budget:
          type: integer
          format: int32
          description: Точное совпадение budget, null - фильмы без бюджета.
          minimum: 1
          nullable: true
        genre:
          $ref: '#/components/schemas/MovieGenre'
        mpaaRating:
          $ref: '#/components/schemas/MpaaRating'
        screenwriter:
          description: Фильтр по сценаристу, null - фильмы без сценариста.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PersonFilter'
    MovieInput:
      type: object
      description: Данные фильма для добавления и обновления.
      additionalProperties: false
      required:
        - name
        - coordinates
        - oscarsCount
        - genre
        - mpaaRating
      properties:
        name:
          type: string
          description: Название фильма.
          minLength: 1
          maxLength: 255
          pattern: '^[a-zA-Zа-яА-ЯЁё0-9 .,:!?()&-]{1,255}$'
          default: 'Слово пацана'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        oscarsCount:
          type: integer
          format: int64
          description: Количество Оскаров, строго больше 0.
          minimum: 1
        budget:
          type: integer
          format: int32
          description: Бюджет, строго больше 0.
          minimum: 1
          nullable: true
        genre:
          $ref: '#/components/schemas/MovieGenre'
        mpaaRating:
          $ref: '#/components/schemas/MpaaRating'
        screenwriter:
          description: Сценарист.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Person'
    Movie:
      type: object
      description: Фильм.
      additionalProperties: false
      required:
        - id
        - name
        - coordinates
        - creationDate
        - oscarsCount
        - genre
        - mpaaRating
      properties:
        id:
          type: integer
          format: int32
          description: Уникальный идентификатор, генерируется автоматически.
          minimum: 1
          readOnly: true
        name:
          type: string
          description: Название фильма.
          minLength: 1
          maxLength: 255
          pattern: '^[a-zA-Zа-яА-ЯЁё0-9 .,:!?()&-]{1,255}$'
          default: 'Груз 200'
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date-time
          description: Дата создания, генерируется автоматически.
          readOnly: true
        oscarsCount:
          type: integer
          format: int64
          description: Количество Оскаров.
          minimum: 0
        budget:
          type: integer
          format: int32
          description: Бюджет.
          minimum: 1
          nullable: true
        genre:
          $ref: '#/components/schemas/MovieGenre'
        mpaaRating:
          $ref: '#/components/schemas/MpaaRating'
        screenwriter:
          description: Сценарист.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Person'
    MoviePage:
      type: object
      description: Постраничная выборка фильмов.
      additionalProperties: false
      required:
        - page
        - size
        - totalElements
        - totalPages
        - content
      properties:
        page:
          type: integer
          format: int32
          description: Номер текущей страницы (нумерация с 0).
          minimum: 0
        size:
          type: integer
          format: int32
          description: Размер страницы.
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          description: Общее количество элементов выборки.
          minimum: 0
        totalPages:
          type: integer
          format: int32
          description: Общее количество страниц.
          minimum: 0
        content:
          type: array
          description: Фильмы текущей страницы.
          items:
            $ref: '#/components/schemas/Movie'
    DeleteResult:
      type: object
      description: Результат пожанрового удаления фильмов.
      additionalProperties: false
      required:
        - deletedCount
      properties:
        deletedCount:
          type: integer
          format: int64
          description: Количество удаленных фильмов.
          minimum: 0
    AverageBudget:
      type: object
      description: Среднее значение поля budget.
      additionalProperties: false
      required:
        - averageBudget
      properties:
        averageBudget:
          type: number
          format: double
          description: Среднее значение budget.
          minimum: 0
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    Error:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - status
        - code
        - message
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          description: HTTP-статус.
          enum:
            - 400
            - 404
            - 422
        code:
          type: string
          enum:
            - MALFORMED_JSON
            - INVALID_PARAMETER
            - UNKNOWN_PARAMETER
            - INVALID_SORT_EXPRESSION
            - UNKNOWN_PROPERTY
            - READ_ONLY_FIELD
            - MOVIE_NOT_FOUND
            - NO_MATCHING_MOVIE
            - VALIDATION_FAILED
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  parameters:
    MovieIdPath:
      name: movie-id
      in: path
      required: true
      description: Идентификатор фильма.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    PageParam:
      name: page
      in: query
      required: false
      description: Номер страницы, нумерация с 0 (по умолчанию 0).
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      description: Размер страницы от 1 до 100 (по умолчанию 10).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    SortParam:
      name: sort
      in: query
      required: false
      description: Сортировка по полю в формате поле,asc|desc (по умолчанию asc).
      schema:
        type: string
        pattern: '^(id|name|coordinates-x|coordinates-y|creation-date|oscars-count|budget|genre|mpaa-rating|screenwriter-name|screenwriter-height|screenwriter-eye-color|screenwriter-hair-color|screenwriter-nationality|screenwriter-location-x|screenwriter-location-y|screenwriter-location-z)(,(asc|desc))?$'
  responses:
    BadRequest400:
      description: Невалидный запрос.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            timestamp: '2026-09-22T12:00:00Z'
            status: 400
            code: INVALID_PARAMETER
            message: 'Параметр page должен быть целым числом не меньше 0, получено: abc'
    MovieNotFound404:
      description: Фильм с указанным идентификатором не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            timestamp: '2026-09-22T12:00:00Z'
            status: 404
            code: MOVIE_NOT_FOUND
            message: 'Фильм с id=42 не найден'
    NoMatchingMovie404:
      description: Фильм, удовлетворяющий критерию, не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            timestamp: '2026-09-22T12:00:00Z'
            status: 404
            code: NO_MATCHING_MOVIE
            message: Фильм с указанным сценаристом не найден
    UnprocessableEntity422:
      description: Невалидные значения полей запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            timestamp: '2026-09-22T12:00:00Z'
            status: 422
            code: VALIDATION_FAILED
            message: Ошибка валидации полей запроса
            details:
              - field: coordinates.x
                message: Значение должно быть строго больше -130
              - field: name
                message: Строка не может быть пустой
