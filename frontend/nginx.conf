server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  # API обоих сервисов — по HTTPS с честной проверкой сертификатов
  # через корень нашего CA (монтируется в /etc/nginx/certs/ca.crt)
  set $movies_backend https://payara:8181;
  location /movies {
    proxy_pass $movies_backend;
    proxy_ssl_server_name on;
    proxy_ssl_name payara;
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $host;
  }

  set $oscar_backend https://wildfly:8443;
  location /oscar {
    proxy_pass $oscar_backend;
    proxy_ssl_server_name on;
    proxy_ssl_name wildfly;
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $host;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
