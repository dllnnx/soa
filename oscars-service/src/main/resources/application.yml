server:
  port: 8443
  servlet:
    context-path: /oscar
  ssl:
    certificate: ${OSCARS_TLS_CERT:/run/secrets/oscars.crt}
    certificate-private-key: ${OSCARS_TLS_KEY:/run/secrets/oscars.key}
    enabled: true

spring:
  application:
    name: oscars-service
  config:
    import: configserver:${CONFIG_URL:http://config:8888}
  jta:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.query.timeout: 3000
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        request.timeout.ms: 2500
        delivery.timeout.ms: 3000
    consumer:
      group-id: oscars-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ru.itmo.oscars.model
        spring.json.value.default.type: ru.itmo.oscars.model.OperationCommand

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
