movies:
  base-url: ${MOVIES_SERVICE_URL:https://payara:8181}
  internal-token: ${MOVIES_INTERNAL_TOKEN}
  connect-timeout: ${MOVIES_CONNECT_TIMEOUT:3s}
  read-timeout: ${MOVIES_READ_TIMEOUT:10s}

spring:
  jta:
    enabled: false
  datasource:
    url: ${OSCARS_DB_URL:jdbc:postgresql://oscars-postgres:5432/oscars}
    username: ${OSCARS_DB_USER:oscars}
    password: ${OSCARS_DB_PASSWORD:oscars}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 3000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.query.timeout: 3000
  sql:
    init:
      mode: always
  application:
    name: oscars-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        request.timeout.ms: 2500
        delivery.timeout.ms: 3000
    consumer:
      group-id: oscars-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ru.itmo.oscars.model
        spring.json.value.default.type: ru.itmo.oscars.model.OperationCommand
